<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <style>
    :root { color-scheme: light dark; --bg: #f2f2f7; --card: #fff; --text: #1d1d1f; --muted: #8e8e93; }
    @media (prefers-color-scheme: dark) { :root { --bg: #000; --card: #1c1c1e; --text: #f5f5f7; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
      font: 16px/1.6 -apple-system, "PingFang SC", "HarmonyOS Sans SC", sans-serif; }
    .card { max-width: 360px; margin: 24px; padding: 28px 24px; border-radius: 20px; background: var(--card); text-align: center; }
    .logo { width: 64px; height: 64px; border-radius: 16px; background: #07c160; margin: 0 auto 16px; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { color: var(--muted); margin: 0 0 18px; }
    ol { text-align: left; padding-left: 20px; margin: 0 0 22px; }
    li { margin-bottom: 8px; }
    button { font: inherit; font-weight: 600; border: 0; border-radius: 14px; padding: 12px 0; width: 100%; background: #07c160; color: #fff; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo"></div>
    <h1>连接你的主电脑</h1>
    <p>只需要扫一次码</p>
    <ol>
      <li>确认手机已打开 Tailscale</li>
      <li>在主电脑的托盘里打开「AgentChat」，点「添加手机 · 显示二维码」</li>
      <li>点下面的按钮，对准二维码</li>
    </ol>
    <button onclick="location.href = 'scan.html'">扫码配对</button>
  </div>
</body>
</html>
