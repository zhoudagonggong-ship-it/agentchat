<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <style>
    :root { color-scheme: light dark; --bg: #f2f2f7; --card: #fff; --text: #1d1d1f; --muted: #8e8e93; --line: #e5e5ea; }
    @media (prefers-color-scheme: dark) { :root { --bg: #000; --card: #1c1c1e; --text: #f5f5f7; --line: #2c2c2e; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
      font: 16px/1.6 -apple-system, "PingFang SC", "HarmonyOS Sans SC", sans-serif; }
    .card { max-width: 340px; margin: 24px; padding: 28px 24px; border-radius: 20px; background: var(--card); text-align: center; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { color: var(--muted); margin: 0 0 20px; }
    button { font: inherit; font-weight: 600; border: 0; border-radius: 12px; padding: 10px 28px; background: #07c160; color: #fff; }
    button.plain { background: transparent; color: #07c160; border: 1px solid #07c160; }
    .tip { border-top: 1px solid var(--line); margin-top: 22px; padding-top: 18px; }
    .tip p { margin-bottom: 12px; font-size: 14px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="title">暂时连不上主电脑</h1>
    <p id="text">请确认手机已打开 Tailscale，并且主电脑开着机。</p>
    <button id="main" onclick="act()">重试</button>
    <div class="tip" id="battery" hidden>
      <p id="battery-text">Tailscale 常被手机的省电功能关掉。打开它的应用信息，点「电池」，选<b>「不受限制」</b>，以后就不会断了。</p>
      <button class="plain" onclick="AllinOneNative.batterySettings('tailscale')">去设置 Tailscale 的电池</button>
      <p id="self-text" style="margin: 14px 0 12px" hidden>AgentChat 自己也要在后台运行，才能及时提醒你。</p>
      <button class="plain" id="self" onclick="AllinOneNative.batterySettings('self')" hidden>允许 AgentChat 在后台运行</button>
    </div>
    <p style="margin: 18px 0 0"><a href="scan.html" style="color:#07c160;text-decoration:none">换了主电脑？重新扫码配对</a></p>
  </div>
  <script>
    // Says why the hub cannot be reached, as far as the phone can tell, and offers the one step that fixes it.
    const native = window.AllinOneNative;
    let state = 'on';
    const COPY = {
      missing: ['手机上还没有 Tailscale', 'AgentChat 通过 Tailscale 连接你的电脑。先安装它，并登录和电脑同一个账号。', '安装 Tailscale'],
      off: ['Tailscale 没有打开', '打开 Tailscale，点开关连上，再回到这里。', '打开 Tailscale'],
      on: ['暂时连不上主电脑', 'Tailscale 已经连上了。主电脑可能关机、睡眠，或 AgentChat 没在运行。', '重试'],
    };
    function render() {
      state = native && native.tailscaleState ? native.tailscaleState() : 'on';
      const [title, text, button] = COPY[state];
      document.getElementById('title').textContent = title;
      document.getElementById('text').textContent = text;
      document.getElementById('main').textContent = button;
      const battery = Boolean(native && native.batterySettings) && state !== 'missing';
      document.getElementById('battery').hidden = !battery;
      const selfFree = !battery || native.batteryFree();
      document.getElementById('self').hidden = selfFree;
      document.getElementById('self-text').hidden = selfFree;
    }
    function act() {
      if (state === 'on') native && native.retry();
      else native.openTailscale();
    }
    // Back from Tailscale or the settings: look again, and try the hub once it is on.
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState !== 'visible') return;
      const before = state;
      render();
      if (before !== 'on' && state === 'on') native.retry();
    });
    render();
  </script>
</body>
</html>
